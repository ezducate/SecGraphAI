[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "secgraphai"
version = "1.0.0rc1"
description = "Security testing for systems that think and act"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SecGraphAI contributors" }]
keywords = ["ai-security", "llm", "red-team", "application-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "networkx>=3.2,<4",
  "platformdirs>=4,<5",
  "packaging>=24,<27",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "build>=1.2", "hypothesis>=6.120", "coverage>=7.6", "ruff>=0.8", "mypy>=1.13", "bandit>=1.8", "types-PyYAML>=6", "types-networkx>=3.2"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "websockets>=14"]
integrations = ["schemathesis>=3.39", "opentelemetry-api>=1.27"]
security = ["cryptography>=43", "pip-audit>=2.7", "detect-secrets>=1.5"]
fuzz = ["atheris>=2.3"]
pdf = ["weasyprint>=62"]
research = ["pypdf>=5"]
all = [
  "pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "build>=1.2", "hypothesis>=6.120", "coverage>=7.6", "ruff>=0.8", "mypy>=1.13", "bandit>=1.8",
  "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "websockets>=14",
  "schemathesis>=3.39", "opentelemetry-api>=1.27",
  "cryptography>=43", "pip-audit>=2.7", "detect-secrets>=1.5", "weasyprint>=62",
  "pypdf>=5",
  "atheris>=2.3",
]

[tool.mutmut]
paths_to_mutate = ["src/secgraphai/policy.py", "src/secgraphai/security.py", "src/secgraphai/runtime.py", "src/secgraphai/reporting.py", "src/secgraphai/plugins.py"]
tests_dir = ["tests/"]

[project.scripts]
secgraph = "secgraphai.cli:app"

[project.urls]
Repository = "https://github.com/ezducate/SecGraphAI"
Issues = "https://github.com/ezducate/SecGraphAI/security/advisories/new"

[tool.hatch.build.targets.wheel]
packages = ["src/secgraphai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E701"]
"demo/*" = ["S"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["secgraphai"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[[tool.mypy.overrides]]
module = ["weasyprint", "opentelemetry", "opentelemetry.*", "pypdf"]
ignore_missing_imports = true
