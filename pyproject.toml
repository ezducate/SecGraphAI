[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "secgraphai"
version = "0.1.0"
description = "Security testing for systems that think and act"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SecGraphAI contributors" }]
keywords = ["ai-security", "llm", "red-team", "application-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "networkx>=3.2,<4",
  "platformdirs>=4,<5",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "build>=1.2"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
all = [
  "pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "build>=1.2",
  "fastapi>=0.115", "uvicorn>=0.30",
]

[project.scripts]
secgraph = "secgraphai.cli:app"

[project.urls]
Repository = "https://github.com/secgraphai/secgraphai"

[tool.hatch.build.targets.wheel]
packages = ["src/secgraphai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
